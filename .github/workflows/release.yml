# Stage 2: dev merged to main -> cut the official release, automatically.
#
# IMPORTANT: this only produces a good changelog if the dev -> main merge
# preserved individual commits. A SQUASH merge collapses the whole release
# into one commit, and the changelog collapses with it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race: a second push while one is mid-release would
# tag the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs full history and all tags to know where the last
          # release ended. The default shallow clone gives it one commit and
          # no tags -- the most common way this breaks in CI.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cut the release
        id: cut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The same script you run locally, so CI cannot drift from your own
          # workflow. It exits 0 without tagging when nothing is releasable.
          ./scripts/release.sh

          # Did it actually tag? If HEAD carries a tag, a release happened.
          if version="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            git push origin main --follow-tags
          else
            echo "No release was cut; nothing further to do."
          fi

      - name: Create the GitHub release
        if: steps.cut.outputs.version != ''
        run: |
          # --latest renders only the release we just tagged.
          ./node_modules/.bin/git-cliff --latest --output RELEASE_NOTES.md
          gh release create "${{ steps.cut.outputs.version }}" \
            --title "${{ steps.cut.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
