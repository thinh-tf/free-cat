# git-cliff configuration
# Docs: https://git-cliff.org/docs/configuration
#
# This file is the thing you came here to practice on. Edit it, then re-run
# `./scripts/changelog-qc.sh` to see the effect immediately -- it reads git
# history and writes nothing, so it is safe to run in a loop.

[changelog]
# Rendered once, at the top of the output.
header = """
# Changelog

All notable changes to this project are documented here.

"""

# Rendered once per release. Tera template language.
# https://keats.github.io/tera/docs/
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**BREAKING**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""

# Rendered once, at the bottom. Empty so that --prepend stays clean.
footer = ""

# Strip leading/trailing whitespace from the template output.
trim = true

[git]
# Parse commits according to the Conventional Commits spec.
conventional_commits = true

# Drop commits that do not match the spec. Set to false to see everything
# that would otherwise be silently discarded -- useful when debugging a
# changelog that is missing entries.
filter_unconventional = true

# Split a commit body into multiple commits on this separator. Off by default.
split_commits = false

# Regex replacements applied to the commit message BEFORE parsing.
commit_preprocessors = [
  # Turn "#123" into a link to a GitHub issue in this repo.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/thinh-tf/free-cat/issues/${2}))" },
]

# Ordered rules. The FIRST match wins, so put skips and specific rules first.
commit_parsers = [
  # --- things that never belong in a changelog ---
  { message = "^Merge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },

  # --- grouped output. The numeric prefix controls section ordering and is
  #     stripped by `striptags`/`trim` in the template above. ---
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^ci|^build", group = "<!-- 6 -->Build & CI" },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },

  # Anything conventional but unmatched above.
  { message = ".*", group = "<!-- 8 -->Other" },
]

# A commit marked breaking is never skipped, even if a parser above says to.
protect_breaking_commits = true

# Only consider tags matching this pattern as releases.
tag_pattern = "v[0-9]*"

# Sort order within each group: "oldest" or "newest".
sort_commits = "oldest"

[bump]
# The version to use for the very first release, when there are no tags yet.
# Without this git-cliff proposes a bare "0.1.0", which fails the
# `tag_pattern` above ("v[0-9]*") and blocks the first release entirely.
initial_tag = "v0.1.0"

# `feat:` bumps the minor version. Set false to keep pre-1.0 on patch bumps.
features_always_bump_minor = true

# `!` / BREAKING CHANGE bumps the major version. Set false to stay in 0.x.
breaking_always_bump_major = false
